<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.55" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.5" stop-color="#e4e4e4"/>
      <stop offset="1" stop-color="#cbcbcb"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- graphite squircle -->
  <g filter="url(#shadow)">
    <rect x="112" y="104" width="800" height="800" rx="184" fill="url(#bg)"/>
    <rect x="112" y="104" width="800" height="800" rx="184" fill="url(#sheen)"/>
    <rect x="113.5" y="105.5" width="797" height="797" rx="182.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <!-- carbon hex node behind the C -->
  <path d="M512 302 L654 384 L654 550 L512 632 L370 550 L370 384 Z"
        fill="none" stroke="url(#mark)" stroke-opacity="0.13" stroke-width="18"
        stroke-linejoin="round"/>

  <!-- C monogram -->
  <path d="M652 385 A205 205 0 1 0 652 641"
        fill="none" stroke="url(#mark)" stroke-width="92"
        stroke-linecap="round"/>
</svg>
