<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area insets are ours to pad, under the
         notch and the home indicator; no zoom, so focusing the composer does
         not leave the page scaled. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carbon" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <!-- Painted before any script or stylesheet arrives: the page's first frame
         is the app's background in the chosen appearance, never white. The
         fallbacks are the desktop's --background, light and dark; once a
         palette has been picked, its colour is remembered and used instead
         (`remote/prefs.ts`). -->
    <style>
      html,
      body {
        margin: 0;
      }
      /* Zero specificity, so the app's own stylesheet still outranks these
         by order, and the dark rule outranks the light one the same way. */
      :where(html, body) {
        background: var(--paint, #fafafa);
      }
      :where(html.dark, html.dark body) {
        background: var(--paint, #171717);
      }
    </style>
    <script>
      ;(() => {
        let mode = 'system'
        let saved = {}
        try {
          const m = localStorage.getItem('themeMode')
          if (m === 'light' || m === 'dark') mode = m
          saved = JSON.parse(localStorage.getItem('carbon.remote.paint') || '{}') || {}
        } catch {}
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        const appearance = dark ? 'dark' : 'light'
        const root = document.documentElement
        root.classList.toggle('dark', dark)
        root.dataset.appearance = appearance
        root.style.colorScheme = appearance
        const color = saved[appearance]
        if (typeof color === 'string' && /^#[0-9a-f]{6}$/i.test(color)) {
          root.style.setProperty('--paint', color)
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = color
        } else if (mode !== 'system') {
          // Forced against the phone's appearance: the metas' media would pick the other one.
          for (const meta of document.querySelectorAll('meta[name="theme-color"]'))
            meta.content = dark ? '#171717' : '#fafafa'
        }
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/remote-icon.png" />
    <link rel="icon" href="/remote-icon.png" />
    <title>Carbon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote/main.tsx"></script>
  </body>
</html>
