name: Release

# Publishing a version is: bump package.json, tag it, push the tag.
#
#   npm version 0.2.0 && git push --follow-tags
#
# That is the entire release process. This workflow builds both macOS
# architectures and attaches the .dmg files to a GitHub Release; the app's
# update check (main/updates.ts) reads that release and tells running installs.
on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be re-run without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    # macos-14 is Apple Silicon; it cross-builds the x64 dmg fine, and native
    # deps (node-pty) get rebuilt per-arch by electron-builder.
    runs-on: macos-14
    # Job-level rather than on the step that uses it: the `secrets` context
    # isn't readable from a step-level `if`, and gating on `env` is what lets
    # the cask bump skip itself instead of failing the release.
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # 24, not 22: `npm test` runs `node --test` straight over the .ts
          # files, and unflagged type stripping only lands late in the 22 line.
          node-version: 24
          cache: npm

      # node-pty builds through node-gyp, which still imports `distutils` —
      # removed from the stdlib in Python 3.12, and the runner's default is
      # newer than that. 3.11 is the last release that carries it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package (arm64 + x64 dmg)
        run: npx electron-builder --mac --publish never

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # --clobber so a re-run replaces assets instead of failing on collision.
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            || echo "release already exists, uploading assets"
          gh release upload "$TAG" dist/*.dmg --clobber

      # Points `brew install/upgrade --cask carbon` at the release that just
      # shipped. Runs last, and only with a key: a missing secret leaves the
      # release itself intact and the cask bumpable by hand.
      #
      # TAP_DEPLOY_KEY is an ed25519 private key whose public half is a
      # write-enabled deploy key on Achour/homebrew-carbon. github.token can't
      # reach another repository, and a deploy key beats a PAT here because it
      # is scoped to that one repo, carries no other permission, and is revoked
      # from the tap's own settings rather than an account-wide token list.
      - name: Bump the Homebrew cask
        if: env.TAP_DEPLOY_KEY != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ARM_SHA=$(shasum -a 256 "dist/Carbon-${VERSION}-arm64.dmg" | cut -d' ' -f1)
          X64_SHA=$(shasum -a 256 "dist/Carbon-${VERSION}-x64.dmg" | cut -d' ' -f1)

          # Confined to this step's runner. `ssh-keyscan` pins GitHub's host key
          # rather than disabling host checking, and IdentitiesOnly stops ssh
          # offering any other identity the runner might pick up.
          KEY="$(mktemp -d)/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:Achour/homebrew-carbon.git tap
          CASK=tap/Casks/carbon.rb

          sed -i '' -E \
            -e "s|^  version \".*\"$|  version \"${VERSION}\"|" \
            -e "s|^  sha256 arm:   \".*\",$|  sha256 arm:   \"${ARM_SHA}\",|" \
            -e "s|^         intel: \".*\"$|         intel: \"${X64_SHA}\"|" \
            "$CASK"

          # sed exits 0 when it matches nothing, so assert the result instead of
          # pushing a cask that still points at the previous release.
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "\"${ARM_SHA}\"" "$CASK"
          grep -q "\"${X64_SHA}\"" "$CASK"

          # A re-run over an unchanged tag has nothing to commit, and an empty
          # commit would fail the job under `set -e`.
          if git -C tap diff --quiet; then
            echo "Cask already at ${VERSION}; nothing to push."
            exit 0
          fi

          git -C tap \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "Carbon cask ${VERSION}"
          git -C tap push
