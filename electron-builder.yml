appId: com.achour.carbon
productName: Carbon
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # node-pty bundles prebuilt native binaries for every OS/arch; a macOS build
  # only needs the host's (and loads build/Release/pty.node anyway), so drop the
  # Windows/Linux/x64 prebuilds — ~58MB of dead weight wrongly shipped in the app.
  - '!**/node-pty/prebuilds/win32-*/**'
  - '!**/node-pty/prebuilds/linux-*/**'
  - '!**/node-pty/prebuilds/darwin-x64/**'
  # The two agent SDKs each carry the provider's whole CLI as an optional
  # dependency — ~300MB apiece — and Carbon spawns the user's own install
  # instead (see main/providerCli.ts), so neither is ever read. Shipping them
  # would mean a second, frozen copy of a tool the user already keeps current:
  # a Carbon release would pin the agent's version, and a CLI fix would wait on
  # an app release to reach anyone. Excluded here rather than uninstalled,
  # because they are transitive optional deps npm re-adds on every install.
  - '!**/@anthropic-ai/claude-agent-sdk-*/**'
  - '!**/@openai/codex-darwin-*/**'
  - '!**/@openai/codex-linux-*/**'
  - '!**/@openai/codex-win32-*/**'
  # @cursor/sdk is the exception that ships, on purpose: it is not a copy of a
  # CLI but Cursor's agent runtime itself, running in main (see
  # docs/cursor.md). Its per-platform helpers go through `extraFiles` below,
  # not through here.
  - '!**/@cursor/sdk-*/**'
# **Cursor's helpers (sandbox, rg, tree-sitter) live in `Contents/node_modules`,
# not beside the SDK in `Resources/app/node_modules`.** The SDK finds
# `@cursor/sdk-<platform>-<arch>` only by walking up from `argv[1]` and from
# `process.execPath` (`platform-package-locator.ts` in its bundle). A packaged
# app's argv[1] is not its entry script, and the execPath walk passes through
# `Contents/MacOS`, `Contents`, `Carbon.app` — never `Resources/app`. Dev works
# only because Electron's binary sits inside the repo's own node_modules.
# Measured: packaged without this, the arm64 package was simply absent
# (electron-builder's collector skips optional dependencies). `${arch}` picks
# each dmg's own; scripts/cursor-sdk-platforms.mjs puts both on disk first.
extraFiles:
  - from: node_modules/@cursor/sdk-darwin-${arch}
    to: node_modules/@cursor/sdk-darwin-${arch}
# Only the MAIN process's runtime packages are in package.json `dependencies`
# (the two agent SDKs + node-pty); every renderer library is a devDependency
# because vite inlines it into out/renderer at build time. electron-builder ships
# only the production tree, so those renderer libs (mermaid, react, lucide,
# base-ui, xterm, the markdown stack, fonts) no longer bloat the app — ~200MB cut.
#
# ASAR stays OFF. It used to be load-bearing — the two vendored CLIs were
# spawned as subprocesses and can't exec from inside an asar archive — and with
# those gone the reason is smaller: node-pty still loads a native module by
# path, and the remaining tree is a few MB where asar would save nothing (it
# doesn't compress) while adding a class of path bug worth avoiding.
asar: false
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # No Developer ID certificate, so no notarization — which costs us the clean
  # first launch (Gatekeeper's "damaged" dialog; README documents `xattr -cr`)
  # but nothing else. `null` is NOT the same as omitting this: electron-builder
  # would otherwise hunt the keychain for an identity and fail the build on a
  # machine that happens to have one.
  #
  # arm64 still needs *some* signature — macOS refuses to exec an unsigned
  # arm64 binary at all — so the ad-hoc pass in `afterPack` supplies one. That
  # is free and unrelated to notarization.
  identity: null
afterPack: build/adhoc-sign.cjs
dmg:
  # `Carbon-0.2.0-arm64.dmg` / `Carbon-0.2.0.dmg`. The arch suffix is what the
  # update check keys on to hand an Apple Silicon Mac the native build
  # (see main/updateCheck.ts).
  artifactName: ${productName}-${version}-${arch}.${ext}
