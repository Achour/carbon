appId: com.achour.carbon
productName: Carbon
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # node-pty bundles prebuilt native binaries for every OS/arch; a macOS build
  # only needs the host's (and loads build/Release/pty.node anyway), so drop the
  # Windows/Linux/x64 prebuilds — ~58MB of dead weight wrongly shipped in the app.
  - '!**/node-pty/prebuilds/win32-*/**'
  - '!**/node-pty/prebuilds/linux-*/**'
  - '!**/node-pty/prebuilds/darwin-x64/**'
# Only the MAIN process's runtime packages are in package.json `dependencies`
# (the two agent SDKs + node-pty); every renderer library is a devDependency
# because vite inlines it into out/renderer at build time. electron-builder ships
# only the production tree, so those renderer libs (mermaid, react, lucide,
# base-ui, xterm, the markdown stack, fonts) no longer bloat the app — ~200MB cut.
#
# ASAR stays OFF on purpose: the two largest bundled runtimes — the Codex CLI
# (@openai/codex-*, ~297MB) and the Claude Agent SDK (@anthropic-ai/
# claude-agent-sdk-*, ~230MB) — are spawned as subprocesses and can't run from
# inside an asar archive. They're the app's irreducible floor; asar doesn't
# compress, so with those unpacked it would save almost nothing while risking
# broken spawn paths.
asar: false
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # No Developer ID certificate, so no notarization — which costs us the clean
  # first launch (Gatekeeper's "damaged" dialog; README documents `xattr -cr`)
  # but nothing else. `null` is NOT the same as omitting this: electron-builder
  # would otherwise hunt the keychain for an identity and fail the build on a
  # machine that happens to have one.
  #
  # arm64 still needs *some* signature — macOS refuses to exec an unsigned
  # arm64 binary at all — so the ad-hoc pass in `afterPack` supplies one. That
  # is free and unrelated to notarization.
  identity: null
afterPack: build/adhoc-sign.cjs
dmg:
  # `Carbon-0.2.0-arm64.dmg` / `Carbon-0.2.0.dmg`. The arch suffix is what the
  # update check keys on to hand an Apple Silicon Mac the native build
  # (see main/updateCheck.ts).
  artifactName: ${productName}-${version}-${arch}.${ext}
